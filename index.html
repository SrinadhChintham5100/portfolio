<!doctype html>
<!--
  index.html — the ONE real HTML page of this app.
  React is a "Single Page Application" (SPA): the browser loads this file,
  then JavaScript (src/main.jsx) draws everything inside <div id="root">.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: what Google and LinkedIn previews show -->
    <title>Srinadh C — Senior Java Full Stack Developer</title>
    <meta
      name="description"
      content="Senior Java Full Stack Developer with 10+ years building Spring Boot microservices, Kafka event-driven systems, AWS cloud-native back ends, and Angular/React front ends."
    />
    <meta property="og:title" content="Srinadh C — Senior Java Full Stack Developer" />
    <meta property="og:description" content="Spring Boot · Kafka · AWS · Angular · React · AI agents" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: Space Grotesk for headings, Inter for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- type="module" lets the browser understand modern import/export -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
